<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="990px" version="1.1" viewBox="0 0 1500 990" width="1500px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F8FAFC" height="990" width="1500" x="0" y="0" /><rect fill="#102840" height="96" width="1500" x="0" y="0" /><text fill="#FFFFFF" font-family="Arial, Liberation Sans, sans-serif" font-size="27" font-weight="bold" text-anchor="start" x="48" y="42">E-01  Conexiones eléctricas preliminares</text><text fill="#BFD8E3" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="48" y="72">ESP32 DevKit + JSN-SR04T + alarma activa 5 V | Topología propuesta, verificar hardware exacto</text><line stroke="#BECBD6" stroke-width="1" x1="48" x2="1452" y1="938" y2="938" /><text fill="#566C7C" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="48" y="963">UTP · Ingeniería Mecatrónica · Proyecto válvulas de flotador mecánico</text><text fill="#566C7C" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" x="1452" y="963">R0 - ANTEPROYECTO</text><rect fill="#F0F7FA" height="470" rx="12" ry="12" stroke="#1468A5" stroke-width="2" width="450" x="70" y="150" /><text fill="#1468A5" font-family="Arial, Liberation Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="98" y="191">U1 · ESP32 DevKit</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="102" y="244">Alimentación USB 5 V aislada</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="102" y="313">GPIO18  →  TRIG</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="102" y="382">GPIO19  ←  ECHO adaptado</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="102" y="451">GPIO23  →  alarma</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="102" y="520">GND compartido</text><rect fill="#EEF7F9" height="340" rx="12" ry="12" stroke="#0C96A2" stroke-width="2" width="525" x="895" y="150" /><text fill="#0C96A2" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="start" x="925" y="191">U2 · JSN-SR04T (modo TRIG/ECHO)</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="929" y="245">VCC  = 5 V DC</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="929" y="305">GND  = GND común</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="929" y="365">TRIG = desde GPIO18</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="929" y="425">ECHO = hacia divisor resistivo</text><polyline fill="none" points="519,306 725,306 725,306 895,306" stroke="#24866E" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polygon fill="#24866E" points="895,306 884,300.5 884,311.5" /><text fill="#24866E" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="649" y="294">GPIO18 → TRIG</text><rect fill="#FFFFFF" height="250" rx="8" ry="8" stroke="#95AAB4" stroke-width="2" width="820" x="600" y="410" /><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="625" y="444">Adaptación de ECHO: 5 V → 3,0 V nominales</text><polyline fill="none" points="1300,478 1160,478" stroke="#B86A1B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#FFF1DF" height="45" rx="3" ry="3" stroke="#B86A1B" stroke-width="2" width="126" x="1032" y="456" /><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1095" y="484">R1 = 10 kΩ</text><polyline fill="none" points="1030,478 849,478 849,545 650,545 650,530" stroke="#B86A1B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#B86A1B" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="635" y="562">Al GPIO19</text><circle cx="849" cy="478" fill="#B86A1B" r="6" /><polyline fill="none" points="849,478 849,572" stroke="#B86A1B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#FFF1DF" height="45" rx="2" ry="2" stroke="#B86A1B" stroke-width="2" width="42" x="828" y="571" /><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="892" y="595">R2</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="885" y="617">15 kΩ</text><polyline fill="none" points="849,616 849,646" stroke="#B86A1B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="885" y="649">GND</text><text fill="#566C7C" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="1165" y="466">ECHO desde U2</text><rect fill="#F3F7F8" height="190" rx="8" ry="8" stroke="#91A9B7" stroke-width="2" width="1350" x="70" y="681" /><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="100" y="721">SALIDA SONORA: etapa de potencia (propuesta)</text><rect fill="#FFFFFF" height="93" rx="8" ry="8" stroke="#9BB4BF" stroke-width="2" width="1250" x="100" y="748" /><text fill="#1468A5" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="128" y="782">GPIO23</text><polyline fill="none" points="222,777 293,777" stroke="#1468A5" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#EDF4FA" height="43" rx="5" ry="5" stroke="#1468A5" stroke-width="2" width="152" x="293" y="756" /><text fill="#1468A5" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="369" y="784">Rb = 1 kΩ</text><polyline fill="none" points="445,777 542,777" stroke="#1468A5" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><circle cx="567" cy="775" fill="#EAF7F5" r="29" stroke="#0C96A2" stroke-width="2" /><text fill="#0C96A2" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="567" y="781">Q1</text><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="567" y="821">NPN</text><polyline fill="none" points="596,775 715,775" stroke="#0C96A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#FFF9EE" height="57" rx="6" ry="6" stroke="#B86A1B" stroke-width="2" width="250" x="715" y="746" /><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="840" y="780">Buzzer activo 5 V</text><polyline fill="none" points="965,775 1020,775" stroke="#B86A1B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#B86A1B" font-family="Arial, Liberation Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="1032" y="781">+5 V</text><polyline fill="none" points="567,804 567,835" stroke="#0C96A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#12253A" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="575" y="835">GND</text><text fill="#566C7C" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="108" y="862">Añadir diodo de protección si el avisador es inductivo. Elegir Q1 según corriente real del buzzer.</text><rect fill="#FFF1E8" height="35" rx="6" ry="6" stroke="#E8BA8A" stroke-width="2" width="1350" x="70" y="900" /><text fill="#9B5019" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="89" y="924">No conectar señales de 5 V directamente al ESP32. Verificar pin 5 V/VIN del DevKit y fuente antes del montaje.</text></svg>